openapi: 3.1.0
info:
  title: Mengantar Public API
  version: 0.3.2
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: >-
    Spesifikasi resmi Mengantar Public API (sinkron per September 2026 dengan https://api-public.mengantar.com/docs/).
    Mencakup 24 endpoint aktif: Alamat, Jadwal Pickup, Cek Ongkir (termasuk Dangerous Goods), Invoice/Saldo,
    Dropshipper, Pembuatan & Pelacakan Order, Cetak Label PDF Asynchronous (BETA), serta Callback Webhook resmi (HMAC-SHA256).
    Per 1 September 2026: Kurir Ninja resmi discontinued. Kurir Pos resmi didukung.
    SPX (Shopee Express) muncul sebagai key `spx` di /order/estimate?courier=all (live, 2026-09-25) tetapi belum ada di docs resmi;
    `courier: spx` untuk POST /order dikonfirmasi support Mengantar, belum teramati live.
    Autentikasi: API key di PATH (`/api/public/{apiKey}`), bukan header.
servers:
  - url: https://api-public.mengantar.com
    description: "Production (https://api-public.mengantar.com)"
  - url: https://sandbox.mengantar.com
    description: "Sandbox (https://sandbox.mengantar.com — catatan: Webhook dan beberapa rute kurir sandbox dibatasi)"
security: []

paths:
  /api/public/{apiKey}/address/search:
    get:
      operationId: searchAddress
      summary: Cari data wilayah (origin/destination code)
      description: '{apiKey} tidak divalidasi pada route ini (legacy) — boleh string apa pun.'
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: keyword, in: query, required: true, schema: { type: string }, description: 'Province / City / District / Subdistrict / Zip' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar wilayah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AddressSearchItem' }

  /api/public/{apiKey}/address:
    get:
      operationId: listOrigins
      summary: List alamat pickup (origin)
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar origin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PickupAddress' }
    post:
      operationId: upsertOrigin
      summary: Buat / update alamat pickup (form; sertakan _id untuk update)
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupAddressInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }
    delete:
      operationId: deleteAddress
      summary: Hapus alamat pickup
      description: Menghapus 1 alamat pickup milik akun terautentikasi.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Address ObjectId to delete }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Alamat berhasil dihapus
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PickupAddress' }

  /api/public/{apiKey}/address/{id}:
    put:
      operationId: updateAddress
      summary: Update data alamat pickup by ID
      description: Mengubah field alamat pickup tertentu. Field yang tidak dikirim tidak akan diubah.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Address ObjectId to update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupAddressUpdateInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Alamat berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PickupAddress' }

  /api/public/{apiKey}/time:
    get:
      operationId: listPickupTimes
      summary: List jadwal pickup untuk satu origin
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: address, in: query, required: true, schema: { type: string } }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar slot pickup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PickupTime' }
    post:
      operationId: addPickupTime
      summary: Tambah jadwal pickup
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address_id, date, time]
              properties:
                address_id: { type: string }
                date: { type: string, pattern: '^\d{2}-\d{2}-\d{4}$', example: '11-27-2022', description: 'Format mm-dd-yyyy (bukan ISO); jadwal minimal 90 menit dari waktu saat ini' }
                time: { type: string, enum: ['9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'] }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Slot pickup yang dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PickupTime' }

  /api/public/{apiKey}/order/estimate:
    get:
      operationId: estimate
      summary: Cek ongkir (single kurir atau all)
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: origin_id, in: query, required: true, schema: { type: string } }
        - { name: destination_id, in: query, required: true, schema: { type: string } }
        - name: courier
          in: query
          schema: { type: string, default: JNE, enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, all] }
          description: >-
            Kurir yang dipilih, case-sensitive (Sap diterima, SAP/sap → 400 Invalid courier).
            SPX tidak bisa diminta sendiri (semua ejaan → 400 Invalid courier, teramati 2026-09-25) — ambil dari `all`.
            Ninja discontinued per 1 Sept 2026 (→ 400 COURIER_DISABLED).
        - { name: weight, in: query, schema: { type: number, default: 1 }, description: kg }
        - { name: COD_AMOUNT, in: query, schema: { type: integer }, description: 'IDR; = Nilai Barang + Ongkir' }
        - name: isDangerousGoods
          in: query
          schema: { type: boolean, default: false }
          description: Set true / 1 untuk tarif Dangerous Goods (JT, SiCepat, iDexpress)
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: >-
            data = objek CourierRate bila courier tunggal, ATAU map {courierKey: CourierRate} bila all.
            Key map berbeda casing dari nama shipment; teramati 2026-09-25: JNE, JNECargo, SiCepat, SiCepatCargo,
            SAP, SAPLite, SapCargo, iDexpress, JT, lion, iDexpressCargo, anteraja, spx, pos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/CourierRate'
                          - type: object
                            additionalProperties: { $ref: '#/components/schemas/CourierRate' }

  /api/order/allEstimatePublic:
    get:
      operationId: estimatePublic
      summary: Cek ongkir semua kurir (public, flat diskon 20%) — TANPA prefix /api/public/{key}
      parameters:
        - { name: origin_id, in: query, required: true, schema: { type: string } }
        - { name: destination_id, in: query, required: true, schema: { type: string } }
        - { name: weight, in: query, schema: { type: number, default: 1 } }
        - { name: COD_AMOUNT, in: query, schema: { type: integer } }
        - { name: isDangerousGoods, in: query, schema: { type: boolean, default: false }, description: Tarif Dangerous Goods }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Map kurir → CourierRate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: object, additionalProperties: { $ref: '#/components/schemas/CourierRate' } }

  /api/order/allEstimate3PL:
    get:
      operationId: estimate3pl
      summary: Cek ongkir 3PL (harga standar tanpa promo) — TANPA prefix /api/public/{key}
      parameters:
        - { name: origin_id, in: query, required: true, schema: { type: string } }
        - { name: destination_id, in: query, required: true, schema: { type: string } }
        - { name: weight, in: query, schema: { type: number, default: 1 } }
        - { name: isDangerousGoods, in: query, schema: { type: boolean, default: false }, description: Tarif Dangerous Goods }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Map kurir → rate (price, estimatedDate, minimumWeightCargo)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: object, additionalProperties: { $ref: '#/components/schemas/CourierRate' } }

  /api/public/{apiKey}/order/getPerformancePublic:
    post:
      operationId: getPerformancePublic
      summary: Skor performa kurir
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, allEstimateData]
              properties:
                city: { type: string, description: CITY_NAME dari /address/search }
                allEstimateData: { type: object, description: 'data dari /order/estimate?courier=all atau /allEstimatePublic' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Skor performa kurir berhasil dihitung
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          couriers:
                            type: array
                            items: { type: object, properties: { key: { type: string }, score: { type: number } } }
                          bestCourier: { type: string }
                          recommended: { type: string }

  /api/public/{apiKey}/invoices:
    get:
      operationId: listInvoices
      summary: List invoice + saldo akun
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1 } }
        - { name: keyword, in: query, schema: { type: string }, description: 'Pencarian nomor invoice, ORDER_ID, atau nomor resi (cnote_no)' }
        - { name: dateRange, in: query, schema: { type: string }, description: 'JSON {"startDate":"…","endDate":"…"}' }
        - { name: invoiceFilter, in: query, schema: { type: string }, description: 'Jenis invoice; gunakan all atau kosong untuk semua' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar invoice dan saldo akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { type: object, additionalProperties: true } }
                      count: { type: integer }
                      balance: { type: integer, description: 'saldo akun (IDR)' }

  /api/public/{apiKey}/dropshippers:
    post:
      operationId: addDropshipper
      summary: Tambah master dropshipper (dedup by name + phone)
      description: Menyimpan data dropshipper ke master akun. Jika nama dan no. HP persis sama sudah ada, record lama dikembalikan (idempoten).
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DropshipperInput' }
      responses:
        '201':
          description: Dropshipper berhasil dibuat atau ditemukan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Dropshipper' }
        '400': { description: 'name atau phone kosong/invalid' }
        '401': { description: 'API Key invalid atau tidak punya izin createOrder' }
        '403': { description: 'Fitur Dropshipper belum diaktifkan di akun' }
        '500': { description: 'Internal server error' }
    get:
      operationId: searchDropshippers
      summary: Cari master dropshipper (prefix search)
      description: Mencari dropshipper tersimpan berdasarkan prefix nama atau no. HP (case-insensitive).
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: search, in: query, schema: { type: string }, description: 'Prefix nama atau no. HP (URL-encode tanda plus sebagai %2B)' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Hasil pencarian dropshipper
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DropshipperListResponse' }
        '400': { description: 'perPage > 100' }
        '401': { description: 'Unauthorized' }
        '403': { description: 'Fitur Dropshipper tidak aktif' }

  /api/public/{apiKey}/label-generation:
    post:
      operationId: requestLabelGeneration
      summary: Request pembuatan PDF label (Async, Whitelist, rate limit 8 print/menit)
      description: Mendaftarkan pekerjaan render label PDF di latar belakang untuk 1 order. Memerlukan whitelist akun.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelGenerationRequest' }
      responses:
        '202':
          description: Job pembuatan label berhasil didaftarkan (PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGenerationPendingResponse' }
        '400': { description: 'Format tidak kompatibel, atau lebih dari 1 orderId dikirim' }
        '403': { description: 'Akun tidak di-whitelist atau order bukan milik akun' }
        '404': { description: 'Order tidak ditemukan' }
        '429': { description: 'Print limit exceeded: maksimal 8 print action per menit' }

  /api/public/{apiKey}/label-generation/{labelGenerationId}:
    get:
      operationId: getLabelGenerationStatus
      summary: Cek status dan download URL label PDF
      description: Read-only; tidak mengonsumsi kuota print 8/menit. URL download aktif selama 15 menit saat COMPLETED.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: labelGenerationId
          in: path
          required: true
          schema: { type: string }
          description: ID 24 karakter yang dikembalikan saat request pembuatan label
      responses:
        '200':
          description: Status job rendering label
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGenerationStatusResponse' }
        '403': { description: 'Not allowed' }
        '404': { description: 'Data not found' }

  /api/public/{apiKey}/order:
    post:
      operationId: createOrder
      summary: Buat shipment (batch)
      description: Saldo kurang → order tetap sukses dibuat dengan isPaid=false dan cnote_no=null. JT Premium/SiCepat → 1 batch per akun (lihat 409). Ninja discontinued per 1 Sept 2026.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Hasil pembuatan (data = array per order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400':
          description: Validasi dropshipper gagal atau parameter order salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403':
          description: COD Pos Indonesia tidak tersedia untuk akun (delivered rate < 82%) — lihat docs/02 §3.3
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosCodIneligible' }
        '409':
          description: Konkurensi batch JT Premium / SiCepat — gabungkan ke 1 batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    get:
      operationId: getOrders
      summary: List order (filter/pagination) atau lacak by order_id/tracking_id
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: order_id, in: query, schema: { type: string } }
        - { name: tracking_id, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: courier, in: query, schema: { type: string } }
        - { name: batch, in: query, schema: { type: string } }
        - { name: cod, in: query, schema: { type: string, enum: [COD, NON_COD] } }
        - { name: status, in: query, schema: { type: string }, description: 'status dipisah koma atau objek {"DELIVERED":true}' }
        - { name: category, in: query, schema: { type: string, enum: [collected_customer, yet_to_collect, need_attention, rts, pending_pickup, redelivery, undelivered, delivery_problem, over_sla, already_been_undelivered, been_undelivered_wo_ticket, been_undelivered_wo_proof] } }
        - { name: ticketFilter, in: query, schema: { type: string, enum: [withticket, without, open, replied] } }
        - { name: receiverFilter, in: query, schema: { type: string } }
        - { name: no_update_after_hour, in: query, schema: { type: string } }
        - { name: no_update_after_day, in: query, schema: { type: string } }
        - { name: dateRange, in: query, schema: { type: string }, description: 'JSON {"startDate":"…","endDate":"…"}' }
        - { name: reseller, in: query, schema: { type: boolean } }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar order atau hasil tracking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/TrackingInfo' } } }
    delete:
      operationId: deleteOrders
      summary: Hapus order (by ids / orderIds). Anteraja hanya setelah 5 menit.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                courier: { type: string }
                ids: { type: array, items: { type: string }, description: array _id order }
                orderIds: { type: array, items: { type: string }, description: '(opsional) array ORDER_ID; jangan bersama ids' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }

  /api/public/{apiKey}/order/pay-unpaid:
    post:
      operationId: payUnpaid
      summary: Bayar order unpaid dalam satu batch
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [batch_id]
              properties:
                batch_id: { type: string }
                courier: { type: string }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Pembayaran order unpaid diproses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { count: { type: integer, description: jumlah order dibayar } }

  /api/public/{apiKey}/my-users:
    get:
      operationId: getAssignees
      summary: List assignee (user tim)
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar assignee akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string } } }

  /api/public/{apiKey}/batch:
    get:
      operationId: getBatches
      summary: List batch
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: courier, in: query, schema: { type: string } }
        - { name: dateRange, in: query, schema: { type: string } }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }
    delete:
      operationId: deleteBatch
      summary: Hapus batch
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: batch _id }
                courier: { type: string }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }

  /api/public/{apiKey}/getReceiverScoreByNumberUser:
    get:
      operationId: getReceiverScore
      summary: Skor penerima per kurir (by no. HP)
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: search, in: query, required: true, schema: { type: string }, description: no. HP penerima }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Skor penerima per kurir
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        description: 'phone + objek per kurir { total, value, inProgress, delivered, rts, undelivered, rate }'
                        additionalProperties: true

webhooks:
  orderStatusUpdate:
    post:
      operationId: orderStatusUpdate
      summary: Order Status Update Webhook (Mengantar → Integrator URL)
      description: >-
        Event perubahan status pesanan yang dikirim Mengantar ke Webhook URL Anda.
        Tervalidasi dengan HMAC-SHA256 hex dari `{x-timestamp}.{raw body}` menggunakan Webhook Secret.
      parameters:
        - name: x-timestamp
          in: header
          required: true
          schema: { type: string, example: '1787548800000' }
          description: Timestamp waktu pengiriman dalam milidetik
        - name: x-signature
          in: header
          required: true
          schema: { type: string }
          description: HMAC-SHA256 signature dalam heksadesimal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '200':
          description: Event diterima dan diakui integrator (harus respons dalam < 5 detik)

components:
  parameters:
    ApiKey:
      name: apiKey
      in: path
      required: true
      schema: { type: string }
      description: API key Mengantar (RAHASIA — server-only)

  responses:
    Envelope:
      description: Amplop standar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

    Error:
      description: Request ditolak (autentikasi, validasi, atau aturan bisnis)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    PosCodIneligible:
      type: object
      description: Body 403 saat COD pos diblokir (docs resmi). Ketiga status memakai message yang sama.
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string, example: Pos Indonesia COD is not available for this account }
        status: { type: string, enum: [new_seller, insufficient, blocked] }
        deliveredRate: { type: number, example: 70 }
        minimumDeliveredRate: { type: number, example: 82 }
      required: [success, message, status]
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        errors: {}
        errorsFront: {}
        code: { type: string, description: 'kode error mesin, mis. COURIER_DISABLED (docs resmi)' }
        courier: { type: string }
      required: [success]

    AddressSearchItem:
      type: object
      properties:
        _id: { type: string }
        COUNTRY_NAME: { type: string }
        PROVINCE_NAME: { type: string }
        CITY_NAME: { type: string }
        CITY_NAME_SI: { type: string }
        DISTRICT_NAME: { type: string }
        SUBDISTRICT_NAME: { type: string }
        ZIP_CODE: { type: string }
        ORIGIN_CODE: { type: string }
        DESTINATION_CODE: { type: string }
        CODE_SAP: { type: string }

    PickupAddress:
      type: object
      properties:
        _id: { type: string }
        PICKUP_NAME: { type: string }
        PICKUP_PIC: { type: string }
        PICKUP_PIC_PHONE: { type: string }
        PICKUP_AUTOFILL: { type: string }
        PICKUP_FULL_AUTOFILL: { type: string }
        PICKUP_ADDRESS: { type: string }
        PICKUP_CITY: { type: string }
        PICKUP_REGION: { type: string }
        PICKUP_DISTRICT: { type: string }
        PICKUP_SUBDISTRICT: { type: string }
        PICKUP_DESTINATION_CODE: { type: string }
        PICKUP_ORIGIN_CODE: { type: string }
        pinpointData:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }

    PickupAddressInput:
      type: object
      required: [PICKUP_AUTOFILL, PICKUP_ADDRESS, PICKUP_PIC_PHONE, PICKUP_PIC, PICKUP_NAME]
      properties:
        PICKUP_AUTOFILL: { type: string, description: _id data wilayah dari /address/search }
        PICKUP_ADDRESS: { type: string }
        PICKUP_PIC_PHONE: { type: string }
        PICKUP_PIC: { type: string }
        PICKUP_NAME: { type: string }
        pinpointData:
          type: object
          description: Lokasi titik koordinat pickup (wajib untuk Instant/Same Day)
          properties:
            lat: { type: number }
            lng: { type: number }
        SHIPPER_ADDR1: { type: string, description: (opsional) alamat retur berbeda }
        SHIPPER_AUTOFILL: { type: string }
        SHIPPER_CONTACT: { type: string }
        SHIPPER_PHONE: { type: string }
        _id: { type: string, description: hanya untuk update }

    PickupAddressUpdateInput:
      type: object
      properties:
        PICKUP_NAME: { type: string }
        PICKUP_PIC: { type: string }
        PICKUP_PIC_PHONE: { type: string }
        PICKUP_ADDRESS: { type: string }
        PICKUP_CITY: { type: string }
        PICKUP_REGION: { type: string }
        PICKUP_DISTRICT: { type: string }
        PICKUP_SUBDISTRICT: { type: string }

    PickupTime:
      type: object
      required: [_id, date, time]
      properties:
        _id: { type: string }
        date: { type: string, description: Tanggal yang dinormalisasi API }
        time: { type: string }
        status: { type: string }
        isSunday: { type: boolean }
        address: { type: object, additionalProperties: true }

    CourierRate:
      type: object
      properties:
        price: { type: number }
        estimatedPrice: { type: number }
        estimatedSpecialPrice: { type: number, description: harga setelah diskon }
        coverage_cod: { type: boolean }
        currency: { type: string, example: IDR }
        discountPercent: { type: number }
        discount: { type: number }
        codFee: { type: number }
        estimate_delivery: { type: string, example: '1 - 2 Days' }
        estimatedDate: { type: string, example: '2-4 hari' }
        unsupported: { type: [boolean, 'null'] }
        unsupported_cod: { type: [boolean, 'null'] }
        isDangerousGoodsSupported: { type: boolean, description: 'kapabilitas DG kurir; hanya bila isDangerousGoods dikirim' }
        discountExtraPercent: { type: number }
        discountExtra: { type: number }
        unsupportedOriginSpx:
          type: boolean
          description: 'Hanya entri spx (teramati 2026-09-25). true = origin tidak dilayani SPX; perlakukan seperti unsupported=true.'
        unsupportedPickup:
          type: boolean
          description: 'Hanya entri spx (teramati 2026-09-25). Arti belum dipastikan.'
        pickupSchedule:
          type: object
          description: 'Hanya entri spx (teramati 2026-09-25). Map tanggal (yyyy-mm-dd) → daftar slot pickup.'
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                timeRangeId: { type: integer }
                start: { type: string, example: '14:00' }
                end: { type: string, example: '22:00' }
                timeEpoch: { type: integer, description: 'epoch (skala detik); hubungan dengan start/end belum dipastikan' }
        cargoPrice: { type: number }
        cargoEstimatedPrice: { type: number }
        cargoDiscountPercent: { type: number }
        minimumWeightCargo: { type: number, description: 'hanya kurir cargo (mode 3PL)' }

    DropshipperInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, description: Nama toko / pengirim dropshipper }
        phone: { type: string, minLength: 9, description: No. telepon dropshipper }

    Dropshipper:
      type: object
      required: [id, name, phone]
      properties:
        id: { type: string, description: ObjectId dropshipper }
        name: { type: string }
        phone: { type: string }

    DropshipperListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/Dropshipper' }
        pagination:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }

    LabelGenerationRequest:
      type: object
      required: [orderId, courier, format]
      properties:
        orderId: { type: string, description: Satu ID order yang valid dan telah terbayar }
        courier: { type: string, example: JNE }
        format:
          type: string
          enum:
            - normal-1
            - normal-2
            - normal-4
            - normal-6
            - thermal-10x10
            - thermal-10x15
            - thermal-8x6
            - thermal-new-10x10
            - thermal-new-10x15

    LabelGenerationPendingResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [labelGenerationId, status]
          properties:
            labelGenerationId: { type: string }
            status: { type: string, enum: [PENDING] }

    LabelGenerationStatusResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [labelGenerationId, status]
          properties:
            labelGenerationId: { type: string }
            status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
            format: { type: string }
            downloadUrl: { type: string, description: GCS signed URL (aktif 15 menit) }
            errorMessage: { type: string }

    CreateOrderRequest:
      type: object
      required: [courier, pickup, orders]
      properties:
        courier:
          type: string
          enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx]
          description: >-
            Kurir untuk shipment. `spx` = SPX Express (Shopee Express): dikonfirmasi support Mengantar,
            belum ada di docs resmi dan belum teramati di create-order live. Ninja discontinued per 1 September 2026.
        pickup: { $ref: '#/components/schemas/Pickup' }
        orders:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }

    Pickup:
      type: object
      required: [type, address_id]
      properties:
        type: { type: string, enum: [scheduledPickup, dropOff] }
        address_id: { type: string, description: '_id alamat pickup dari GET /address; bukan _id wilayah' }
        time_id: { type: string, description: wajib bila scheduledPickup }
        volume: { type: string, enum: [volumeMotor, volumeMobil, volumeTruck], description: wajib bila scheduledPickup }
      allOf:
        - if:
            properties: { type: { const: scheduledPickup } }
          then:
            properties:
              time_id: {}
              volume: {}
            required: [time_id, volume]

    OrderItem:
      type: object
      required: [customerAddressDataId, customerAddress, customerName, customerPhone, weight, quantity, parcelContent]
      oneOf:
        - properties:
            goodsValue: {}
            COD: {}
          required: [goodsValue]
          not:
            properties: { COD: {} }
            required: [COD]
        - properties:
            COD: {}
            goodsValue: {}
          required: [COD]
          not:
            properties: { goodsValue: {} }
            required: [goodsValue]
      properties:
        customerAddressDataId: { type: string, description: 'destination_id (_id dari /address/search)' }
        customerAddress: { type: string, minLength: 10 }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, pattern: '^\d{10,15}$' }
        parcelContent: { type: string, minLength: 1 }
        weight: { type: number, minimum: 1, description: 'kg; bila customProducts diisi harus = Σ(qty×weight)' }
        quantity: { type: integer, minimum: 1, description: 'bila customProducts diisi harus = Σ(qty)' }
        goodsValue: { type: number, minimum: 0, description: 'NON-COD (eksklusif vs COD)' }
        COD: { type: number, minimum: 0, description: 'COD = Nilai Barang + Ongkir + COD Fee (eksklusif vs goodsValue)' }
        assignee: { type: string, description: _id dari /my-users }
        destinationMark: { type: string }
        deliveryInstruction: { type: string }
        dontIncludeSubdistrict: { type: boolean }
        cargo: { type: boolean, description: 'true → Cargo (JNE, SiCepat, Sap, iDexpress)' }
        isDangerousGoods: { type: boolean, default: false, description: 'Dangerous Goods order (didukung: JT, SiCepat HALU, iDexpress Regular)' }
        dropShipper:
          type: object
          description: Data dropshipper tersimpan dari master dropshippers
          required: [id, name, phone]
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string }
        customProducts:
          type: array
          description: 'Hanya JNE, SiCepat, Sap, JNT. Aliases: quantity/orderQuantity, harga/regularPrice.'
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1 }
              variant: { description: string atau object }
              qty: { type: number, minimum: 1, description: 'alias: quantity, orderQuantity' }
              price: { type: number, minimum: 0, description: 'alias: harga, regularPrice' }
              weight: { type: number, exclusiveMinimum: 0, description: default 1 }

    CreateOrderResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        batch: { type: string }
        batch_id: { type: string }
        courier: { type: string }
        errors: { type: array, items: {} }
        data:
          type: array
          items:
            type: object
            properties:
              ORDER_ID: { type: string }
              cnote_no: { type: [string, 'null'], description: nomor resi; null bila unpaid/belum tersedia }
              status: { type: string }
              statusCategory: { type: string }
              isPaid: { type: boolean }
              batch_id: { type: string }
              batch: { type: string }
              dropShipperId: { type: string }
              error: {}

    TrackingInfo:
      type: object
      properties:
        cnote_no: { type: [string, 'null'] }
        ORDER_ID: { type: string }
        courier: { type: string }
        status: { type: string }
        statusCategory: { type: string }
        RECEIVER_NAME: { type: string }
        RECEIVER_PHONE: { type: string }
        RECEIVER_CITY: { type: string }
        RECEIVER_REGION: { type: string }
        GOODS_DESC: { type: string }
        WEIGHT: { type: number }
        batch: { type: string }
        createdAt: { type: string }
        history:
          type: array
          items:
            type: object
            properties:
              date: { type: string, description: 'Format DD-MM-YYYY HH:mm (Asia/Jakarta)' }
              desc: { type: string, description: Keterangan progres status }

    WebhookPayload:
      type: object
      required: [cnote_no, order_id, courier, status_category]
      properties:
        cnote_no: { type: string, description: Nomor resi / AWB pengiriman }
        order_id: { type: string, description: ID unik pesanan Mengantar }
        courier: { type: string, description: Kurir penangan pesanan }
        status_category:
          type: string
          description: >-
            Kategori status pengiriman resmi Mengantar (PENDING PICKUP, PICKED UP, ON DELIVERY,
            DELIVERED, UNDELIVERED, PICKUP FAILED, RTS, ACTIVE/WAITING NEXT PROCESS, ERROR, CANCELED/CANCELLED).
