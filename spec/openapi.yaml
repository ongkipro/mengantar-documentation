openapi: 3.1.0
info:
  title: Mengantar Public API
  version: 0.5.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: >-
    Spesifikasi Mengantar Public API, disinkronkan 19 November 2026 dengan docs resmi v2.0.0
    (https://api-public.mengantar.com/docs/llms.txt — satu halaman Markdown per endpoint; snapshot di docs/official-snapshot/).
    Galat autentikasi/izin/IP/whitelist seragam: 403 {"success":false,"message":"Not allowed"}.
    Mencakup 25 operasi: Alamat, Jadwal Pickup, Cek Ongkir (termasuk Dangerous Goods), Invoice/Saldo,
    Dropshipper, Pembuatan (dengan header idempotencyKey) & Pelacakan Order, simulasi status order (sandbox saja),
    Cetak Label PDF Asynchronous (BETA), serta Callback Webhook resmi (HMAC-SHA256).
    Per 1 September 2026: Kurir Ninja resmi discontinued. Kurir Pos dan SPX (`spx`) tercantum di docs resmi.
    Autentikasi: API key di PATH (`/api/public/{apiKey}`), bukan header.
servers:
  - url: https://api-public.mengantar.com
    description: "Production (https://api-public.mengantar.com)"
  - url: https://sandbox.mengantar.com
    description: "Sandbox (https://sandbox.mengantar.com — akun, key & Webhook Secret terpisah; batasan kurir sandbox: lihat docs/02)"
security: []

paths:
  /api/public/{apiKey}/address/search:
    get:
      operationId: searchAddress
      summary: Cari data wilayah (origin/destination/customerAddressDataId)
      description: >-
        Permission Create order (key invalid → 403 Not allowed; teramati sandbox 2026-11-19). Maks 50 hasil, tanpa pagination.
        Keyword tanpa kata tersisa setelah tanda baca dibuang → 200 data kosong.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: keyword, in: query, required: true, schema: { type: string }, description: 'Satu atau lebih kata; setiap kata harus cocok provinsi/kota/kecamatan/kelurahan/kode pos (case-insensitive). Hilang → 400.' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar wilayah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AddressSearchItem' }

  /api/public/{apiKey}/address:
    get:
      operationId: listOrigins
      summary: List alamat pickup (origin)
      description: Tanpa parameter mengembalikan semua alamat. Tidak ada total; page & size hanya berlaku bila keduanya dikirim.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: keyword, in: query, schema: { type: string }, description: 'Substring PICKUP_NAME (case-insensitive); pakai satu kata' }
        - { name: page, in: query, schema: { type: integer, minimum: 1 }, description: 'Hanya bersama size' }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: 'Hanya bersama page' }
        - { name: fields, in: query, schema: { type: string }, description: 'Daftar field dipisah koma tanpa spasi, mis. _id,PICKUP_NAME; _id selalu ada' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar origin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PickupAddress' }
    post:
      operationId: upsertOrigin
      summary: Tambah alamat pickup (untuk mengubah alamat, pakai PUT /address/{id})
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupAddressInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }
    delete:
      operationId: deleteAddress
      summary: Hapus alamat pickup
      description: >-
        Menghapus 1 alamat milik akun (permanen). id hilang/sudah dihapus/bukan milik akun → 400 "Something went wrong";
        id bukan ObjectId → 400 "Error on delete address". Hapus kedua kali → error pertama, bukan sukses.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Address ObjectId to delete }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Alamat berhasil dihapus
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PickupAddress' }

  /api/public/{apiKey}/address/{id}:
    put:
      operationId: updateAddress
      summary: Update data alamat pickup by ID
      description: >-
        Hanya field yang dikirim yang diubah; body kosong sukses tanpa perubahan; field di luar skema diabaikan.
        Wilayah (provinsi/kota/kecamatan/kelurahan/kode pos) selalu dari PICKUP_AUTOFILL. Galat: 400 id bukan ObjectId,
        422 ValidationError (alamat bukan milik akun, PIC phone invalid/null, PICKUP_AUTOFILL kosong/tidak ditemukan, SHIPPER_AUTOFILL tidak ditemukan).
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Address ObjectId to update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupAddressUpdateInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Alamat berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PickupAddress' }

  /api/public/{apiKey}/time:
    get:
      operationId: listPickupTimes
      summary: List jadwal pickup mendatang
      description: >-
        Tanpa parameter → semua jadwal mendatang untuk semua alamat (jadwal lewat tidak pernah dikembalikan). Tanpa pagination
        dan tanpa urutan; hasil tidak menyebut alamatnya — kirim address untuk satu alamat.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: address, in: query, required: false, schema: { type: string }, description: '_id alamat; tidak ada/tanpa jadwal → []' }
        - name: courier
          in: query
          required: false
          schema: { type: string }
          description: 'Sembunyikan slot yang tak bisa dipakai kurir (case-sensitive): JNE tanpa Minggu & tanpa 19:00/20:00; anteraja tanpa Minggu; iDexpress tanpa 20:00 dan hanya > 90 menit dari sekarang; lainnya tanpa filter.'
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar slot pickup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PickupTime' }
    post:
      operationId: addPickupTime
      summary: Tambah jadwal pickup
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address_id, date, time]
              properties:
                address_id: { type: string }
                date:
                  description: >-
                    String MM-DD-YYYY (mis. "11-30-2026") ATAU number Unix ms (mis. 1794787200000). Timestamp sebagai string ditolak.
                    Add Time tidak mengecek 90 menit; Create order yang menolak ("invalid pickup time").
                  oneOf:
                    - { type: string, pattern: '^\d{2}-\d{2}-\d{4}$', example: '11-30-2026' }
                    - { type: integer, example: 1794787200000 }
                time: { type: string, enum: ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'], description: 'Selalu dua digit; "9:00" ditolak' }
      description: >-
        Setiap panggilan membuat jadwal baru (meski address/date/time sama) — buat sekali, pakai ulang _id.
        Galat: 400 field hilang (satu per satu: address_id, time, date) / time tidak diizinkan / address_id atau date tidak valid; 404 address not found.
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Slot pickup yang dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PickupTime' }

  /api/public/{apiKey}/order/estimate:
    get:
      operationId: estimate
      summary: Cek ongkir (single kurir atau all)
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: origin_id, in: query, required: true, schema: { type: string } }
        - { name: destination_id, in: query, required: true, schema: { type: string } }
        - name: courier
          in: query
          schema: { type: string, default: JNE, enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx, all] }
          description: >-
            Kurir, case-sensitive, hanya sekali (Sap diterima, SAP/sap → 400 Invalid courier). `spx` tunggal kini berfungsi
            (sandbox 2026-11-19 → 200 dengan pickupSchedule). Ninja (atau spx saat SPX dimatikan) → 400 code COURIER_DISABLED.
        - { name: weight, in: query, schema: { type: number, default: 1 }, description: 'kg, positif; desimal boleh (0.5)' }
        - { name: COD_AMOUNT, in: query, schema: { type: integer }, description: 'IDR (nilai barang + ongkir); hanya untuk menghitung codFee' }
        - name: isDangerousGoods
          in: query
          schema: { type: boolean, default: false }
          description: "true / 1 → tarif & cakupan Dangerous Goods. Hanya SiCepat dan iDexpress membawa DG; kurir lain isDangerousGoodsSupported=false."
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: >-
            data = objek CourierRate bila courier tunggal, ATAU map {courierKey: CourierRate} bila all. Docs resmi: 14 key
            JNE, JNECargo, SiCepat, SiCepatCargo, SAP, SAPLite, SapCargo, iDexpress, JT, lion, iDexpressCargo, anteraja, spx, pos,
            plus JTEco bila rute punya tarif J&T ECO dan request bukan DG (JTEco bukan nilai courier; pesan via eco:true pada order JT).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/CourierRate'
                          - type: object
                            additionalProperties: { $ref: '#/components/schemas/CourierRate' }

  /api/order/allEstimatePublic:
    get:
      operationId: estimatePublic
      summary: Cek ongkir semua kurir (public, diskon dasar 20%) — TANPA key, TANPA prefix /api/public/{key}
      description: >-
        15 key: JNE, JNECargo, SiCepat, SiCepatCargo, SAP, SAPLite, SapCargo, iDexpress, iDlite, JT, lion, iDexpressCargo,
        anteraja, spx, pos (iDlite bukan nilai courier). Hanya memeriksa format id; id valid yang tidak cocok alamat tetap
        mengembalikan tarif. Tidak memeriksa batas COD. Galat 400 "from or to is empty" / "origin_id is invalid".
        Teramati sandbox 2026-11-19: 200, 15 key; + JTEco dengan withCourierServices=true.
      parameters:
        - { name: origin_id, in: query, required: true, schema: { type: string } }
        - { name: destination_id, in: query, required: true, schema: { type: string } }
        - { name: weight, in: query, schema: { type: number, default: 1 } }
        - { name: COD_AMOUNT, in: query, schema: { type: integer }, description: 'hanya untuk codFee' }
        - { name: isDangerousGoods, in: query, schema: { type: boolean, default: false }, description: Tarif & cakupan Dangerous Goods }
        - { name: withCourierServices, in: query, schema: { type: boolean, default: false }, description: 'true → juga layanan non-default; saat ini JTEco (bila rute punya tarif ECO dan bukan DG)' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Map kurir → CourierRate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: object, additionalProperties: { $ref: '#/components/schemas/CourierRate' } }

  /api/order/allEstimate3PL:
    get:
      operationId: estimate3pl
      summary: Cek ongkir 3PL (harga standar tanpa diskon/flat) — TANPA key, TANPA prefix /api/public/{key}
      description: >-
        15 key seperti allEstimatePublic (+ JTEco bila rute punya tarif ECO dan bukan DG). Entri ringkas: price, estimatedDate,
        unsupported, unsupported_cod (null = kurir tidak menjawab, bukan ya/tidak), isDangerousGoodsSupported (bila DG),
        minimumWeightCargo (entri cargo), isFlat (anteraja). Tanpa COD_AMOUNT (diabaikan bila dikirim).
      parameters:
        - { name: origin_id, in: query, required: true, schema: { type: string } }
        - { name: destination_id, in: query, required: true, schema: { type: string } }
        - { name: weight, in: query, schema: { type: number, default: 1 } }
        - { name: isDangerousGoods, in: query, schema: { type: boolean, default: false }, description: Tarif Dangerous Goods }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Map kurir → rate (price, estimatedDate, minimumWeightCargo)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: object, additionalProperties: { $ref: '#/components/schemas/CourierRate' } }

  /api/public/{apiKey}/order/getPerformancePublic:
    post:
      operationId: getPerformancePublic
      summary: Skor performa kurir di kota tujuan (whitelist di produksi; terbuka di sandbox)
      description: >-
        Permission Check shipping fee. bestCourier = skor tertinggi yang bisa melayani rute (JNE bila tidak ada);
        recommendedDGCourier = terbaik di antara kurir isDangerousGoodsSupported (iDexpress bila tidak ada);
        recommended selalu JNE — pakai bestCourier. anteraja/pos/spx selalu skor 0. city tidak cocok → semua 0.
        Galat: 400 allEstimateData is required, 405 bukan POST, 500 body bukan JSON.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, allEstimateData]
              properties:
                city: { type: string, description: 'CITY_NAME dari /address/search, persis & case-sensitive (mis. BANDUNG)' }
                allEstimateData: { type: object, description: 'data dari /order/estimate?courier=all atau /allEstimatePublic' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Skor performa kurir berhasil dihitung
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          couriers:
                            type: array
                            items: { type: object, properties: { key: { type: string }, score: { type: number } } }
                          bestCourier: { type: string }
                          recommendedDGCourier: { type: string }
                          recommended: { type: string, description: 'Selalu JNE; pakai bestCourier' }

  /api/public/{apiKey}/invoices:
    get:
      operationId: listInvoices
      summary: List invoice + saldo akun
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 1 }, description: 'Diabaikan bila cursor dikirim' }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 }, description: '> 100 → 400' }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor dari respons sebelumnya; tak dikenal → 400' }
        - { name: keyword, in: query, schema: { type: string }, description: 'Potongan nomor invoice, ORDER_ID, cnote_no, deskripsi item, atau nominal persis. Teks polos (karakter seperti ( → 400)' }
        - { name: ids, in: query, schema: { type: string }, description: 'inv_number dipisah koma' }
        - { name: dateRange, in: query, schema: { type: string }, description: 'JSON {"startDate":"…","endDate":"…"} — keduanya wajib' }
        - { name: invoiceFilter, in: query, schema: { type: string, enum: [all, typePayment, typeRefund, typeAddBalance, typeWithdraw, typeReconciliation] }, description: 'Tipe tak dikenal → daftar kosong' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar invoice dan saldo akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { type: object, additionalProperties: true } }
                      count: { type: integer, description: 'jumlah invoice yang cocok filter (semua halaman)' }
                      balance: { type: integer, description: 'saldo akun (IDR), tidak terpengaruh filter' }
                      nextCursor: { type: string, description: 'kosong pada halaman terakhir' }

  /api/public/{apiKey}/dropshippers:
    post:
      operationId: addDropshipper
      summary: Tambah master dropshipper (dedup by name + phone)
      description: >-
        Menyimpan dropshipper (nama & no. HP pengirim pada shipment/label dropship). Nama + phone persis sama → record lama
        dikembalikan (pencocokan exact: beda kapital atau 08…/+62… = dropshipper berbeda). Kirim phone sebagai string.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DropshipperInput' }
      responses:
        '201':
          description: Dropshipper berhasil dibuat atau ditemukan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Dropshipper' }
        '400': { description: 'Missing fields / Invalid Dropshipper phone number / Invalid Dropshipper name (spasi saja)' }
        '403': { description: 'Not allowed (key/izin/IP) atau fitur Dropshipper belum aktif (aktifkan lewat Seller Web)' }
        '500': { description: 'name/phone bukan string, atau body bukan JSON' }
    get:
      operationId: searchDropshippers
      summary: Cari master dropshipper (prefix search)
      description: >-
        Prefix nama atau no. HP (case-insensitive), diurutkan nama, default 20 per halaman. Tanpa total: halaman terakhir
        bila jumlah < perPage. Karakter seperti ( atau [ di search → 500.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: search, in: query, schema: { type: string }, description: 'Prefix nama atau no. HP (URL-encode tanda plus sebagai %2B)' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Hasil pencarian dropshipper
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DropshipperListResponse' }
        '400': { description: 'perPage > 100' }
        '403': { description: 'Not allowed, atau fitur Dropshipper tidak aktif' }
        '500': { description: 'search berisi karakter regex seperti ( atau [' }

  /api/public/{apiKey}/label-generation:
    post:
      operationId: requestLabelGeneration
      summary: Request pembuatan PDF label (Async, Whitelist, rate limit 8 print/menit)
      description: Mendaftarkan pekerjaan render label PDF di latar belakang untuk 1 order. Memerlukan whitelist akun.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelGenerationRequest' }
      responses:
        '200':
          description: >-
            Job didaftarkan (status PENDING; tanpa downloadUrl, juga saat job aktif yang sama dipakai ulang). Docs resmi tidak
            menyebut kode status; versi lama repo ini menulis 202 — terima 2xx.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGenerationPendingResponse' }
        '400': { description: 'orderId/courier/format hilang, lebih dari 1 orderId, format tak dikenal, atau thermal-new untuk kurir selain JT/spx' }
        '403': { description: 'Not allowed (key/IP/whitelist), atau Order does not belong to this account' }
        '404': { description: 'Order tidak ditemukan' }
        '429': { description: 'Print limit exceeded: maksimal 8 print action per menit' }

  /api/public/{apiKey}/label-generation/{labelGenerationId}:
    get:
      operationId: getLabelGenerationStatus
      summary: Cek status dan download URL label PDF
      description: >-
        Read-only; tidak mengonsumsi kuota print 8/menit. downloadUrl hanya saat COMPLETED, aktif 15 menit, baru tiap poll.
        FAILED tetap 200 success:true (kegagalan di data.status). Di sandbox label siap ~25 detik; polling beberapa detik sekali.
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - name: labelGenerationId
          in: path
          required: true
          schema: { type: string }
          description: ID 24 karakter yang dikembalikan saat request pembuatan label
      responses:
        '200':
          description: Status job rendering label
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGenerationStatusResponse' }
        '403': { description: 'Not allowed' }
        '404': { description: 'Data not found' }

  /api/public/{apiKey}/order:
    post:
      operationId: createOrder
      summary: Buat shipment (batch)
      description: >-
        200 + success:true = batch diproses, BUKAN semua order terkirim: cek tiap order (active+cnote_no; isPaid:false;
        status:error + error; ordersClosedDestination). Saldo kurang → isPaid=false, cnote_no=null. JT Premium/SiCepat → 1 batch per akun (409).
        Field milik sistem (price, estimatedPrice, estimatedSpecialPrice, isFlat, discount*, allEstimateData, iDlite, iDliteDiscount)
        → 400 "Fields not allowed in public API request" meski bernilai 0/null/"". Ninja → 400. Pesan bisa ID atau EN (bahasa akun). Header opsional `idempotencyKey` (1–50 karakter, diingat 24 jam per akun):
        kirim body yang sama persis pada setiap retry. Replay mengembalikan respons pertama dengan header
        `Idempotent-Replayed: true` dan field `idempotentReplayed: true`; respons 5xx pertama juga di-replay, tidak dijalankan ulang.
      parameters:
        - { $ref: '#/components/parameters/ApiKey' }
        - name: idempotencyKey
          in: header
          required: false
          description: Referensi milik Anda (mis. nomor invoice), 1–50 karakter; spasi depan/belakang diabaikan.
          schema: { type: string, minLength: 1, maxLength: 50 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Hasil pembuatan (data = array per order), atau replay idempotency
          headers:
            Idempotent-Replayed:
              description: "`true` bila respons ini salinan request pertama dengan idempotencyKey yang sama"
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400':
          description: "Validasi dropshipper gagal, parameter order salah, atau `code: IDEMPOTENCY_KEY_INVALID` (header kosong / > 50 karakter)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403':
          description: 'Not allowed (key/izin/IP), fitur Dropshipper nonaktif, atau COD Pos Indonesia tidak tersedia (status new_seller/insufficient/blocked) — docs/02 §3.3'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosCodIneligible' }
        '409':
          description: >-
            Konkurensi batch JT Premium / SiCepat (gabungkan ke 1 batch), atau `code: IDEMPOTENCY_REQUEST_IN_PROGRESS`
            (tunggu `Retry-After`, kunci sama) / `IDEMPOTENCY_REQUEST_UNRESOLVED` (cek GET /order, kirim order yang kurang dengan kunci baru).
          headers:
            Retry-After:
              description: Detik tunggu (pada IDEMPOTENCY_REQUEST_IN_PROGRESS)
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '422':
          description: "`code: IDEMPOTENCY_KEY_REUSED` — kunci sudah dipakai untuk body lain"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503':
          description: "`code: IDEMPOTENCY_UNAVAILABLE` — kunci tidak bisa dicek, tidak ada yang dibuat; retry dengan kunci sama"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    get:
      operationId: getOrders
      summary: List order (filter/pagination) atau lacak by order_id/tracking_id
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: order_id, in: query, schema: { type: string } }
        - { name: tracking_id, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 1 }, description: 'Diabaikan bila cursor dikirim; tanpa courier page×size ≤ 1500' }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 }, description: '> 100 → 400' }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor dari respons sebelumnya (dianjurkan untuk daftar panjang); invalid → 400' }
        - { name: courier, in: query, schema: { type: string }, description: 'Nilai persis; nilai lain tidak ditolak dan bisa memberi daftar salah. courier=Ninja tetap bisa membaca order lama' }
        - { name: batch, in: query, schema: { type: string }, description: 'Nomor batch (mis. 26111310KDX9LE), bukan _id batch' }
        - { name: cod, in: query, schema: { type: string, enum: [COD, NON_COD] } }
        - { name: status, in: query, schema: { type: string }, description: 'kode status dipisah koma atau objek {"DELIVERED_PENDING":true}' }
        - { name: keyword, in: query, schema: { type: string }, description: 'ORDER_ID, resi, nama penerima; dibaca sebagai regex — escape [ ( +' }
        - { name: dateRange, in: query, schema: { type: string }, description: 'JSON {"startDate":"…","endDate":"…"} (URL-encoded); dibaca per hari WIB, endDate sampai akhir hari. Tanpa dateRange ≈ 6 bulan terakhir (belum diarsip)' }
        - name: category
          in: query
          deprecated: true
          schema: { type: string, enum: [collected_customer, yet_to_collect, need_attention, rts, pending_pickup, redelivery, undelivered, delivery_problem, over_sla, already_been_undelivered, been_undelivered_wo_ticket, been_undelivered_wo_proof] }
          description: 'Tidak ada di docs resmi v2 (asal: plugin). Jangan diandalkan.'
        - { name: ticketFilter, in: query, deprecated: true, schema: { type: string, enum: [withticket, without, open, replied] }, description: 'Tidak ada di docs resmi v2' }
        - { name: receiverFilter, in: query, deprecated: true, schema: { type: string }, description: 'Tidak ada di docs resmi v2' }
        - { name: no_update_after_hour, in: query, deprecated: true, schema: { type: string }, description: 'Tidak ada di docs resmi v2' }
        - { name: no_update_after_day, in: query, deprecated: true, schema: { type: string }, description: 'Tidak ada di docs resmi v2' }
        - { name: reseller, in: query, deprecated: true, schema: { type: boolean }, description: 'Tidak ada di docs resmi v2' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar order atau hasil tracking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TrackingInfo' } }
                      nextCursor: { type: string, description: 'kosong pada halaman terakhir' }
    delete:
      operationId: deleteOrders
      summary: Hapus order (by ids / orderIds) — cek deletedCount, bukan success
      description: >-
        Hanya order berstatus active, error, PENDING PICKUP, PICKUP FAILED, PICKUP_FAILED_API (atau kosong). 200 success:true bisa
        tetap menghapus 0/sebagian: baca deletedCount & deletedOrderIds. courier wajib untuk selain JNE (tanpa itu → "Orders already deleted").
        lion/anteraja/pos/spx menambah errorMessages, ordersCount, totalBalanceRefund. Anteraja hanya ≥ 5 menit setelah dibuat.
        Order hasil simulasi tidak bisa dihapus.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                courier: { type: string, enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx], default: JNE }
                ids: { type: array, items: { type: string }, description: 'array _id order (field ids jamak; id tunggal tidak diterima)' }
                orderIds: { type: array, items: { type: string }, description: 'array ORDER_ID; bila dikirim, ids diabaikan' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }

  /api/public/{apiKey}/order/simulation:
    post:
      operationId: simulateOrderStatus
      summary: (Sandbox saja) Simulasikan status order
      description: >-
        Hanya ada di deployment sandbox; produksi selalu 404. Memindahkan order milik akun ke ON DELIVERY, DELIVERED,
        atau RTS dan mengirim satu webhook bila Webhook URL terpasang. Butuh permission "Check order status".
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courier]
              description: Kirim tepat satu dari orderId / trackingId dan tepat satu dari statusCategory / status.
              allOf:
                - oneOf:
                    - { required: [orderId] }
                    - { required: [trackingId] }
                - oneOf:
                    - { required: [statusCategory] }
                    - { required: [status] }
              properties:
                courier: { type: string, enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx] }
                orderId: { type: string, description: "ORDER_ID (kirim tepat satu dari orderId / trackingId)" }
                trackingId: { type: string, description: cnote_no }
                statusCategory: { type: string, enum: [ON DELIVERY, DELIVERED, RTS], description: "Kirim tepat satu dari statusCategory / status" }
                status: { type: string, enum: [ON DELIVERY, DELIVERED, RTS] }
      responses:
        '200':
          description: Status tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { description: "Key tidak valid atau tanpa permission Check order status" }
        '404': { description: "Bukan sandbox, order tidak ditemukan, atau milik akun lain" }
        '409': { description: "Order sudah dihapus" }
        '422': { description: "Kurir/identifier/target status tidak valid" }
  /api/public/{apiKey}/order/pay-unpaid:
    post:
      operationId: payUnpaid
      summary: Bayar order unpaid dalam satu batch
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [batch_id]
              properties:
                batch_id: { type: string, description: '_id batch (batch_id dari create order atau _id dari GET /batch)' }
                courier: { type: string, enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx], default: JNE, description: 'Wajib selain JNE; tidak cocok → batch not found' }
      description: >-
        Total semua order unpaid di batch ditagih sekaligus; saldo kurang → tidak ada yang dibayar (400 balance is not enough).
        Bentuk respons beda per kurir: JNE/SiCepat/Sap/iDexpress/JT → data = jumlah dibayar (number) + cnote_no (array) di top level;
        lion/anteraja/pos/spx → data = { cnote_no, count }. Tidak ada yang perlu dibayar: kelompok pertama 200 data 0,
        kelompok kedua 400 "no unpaid orders in this batch".
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Pembayaran order unpaid diproses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        oneOf:
                          - { type: integer, description: 'jumlah order dibayar (JNE, SiCepat, Sap, iDexpress, JT)' }
                          - type: object
                            description: 'lion, anteraja, pos, spx'
                            properties: { cnote_no: { type: array, items: { type: string } }, count: { type: integer } }
                      cnote_no: { type: array, items: { type: string }, description: 'top level untuk JNE, SiCepat, Sap, iDexpress, JT' }

  /api/public/{apiKey}/my-users:
    get:
      operationId: getAssignees
      summary: List assignee (user tim)
      description: Cukup key aktif dari IP yang diizinkan (tanpa permission lain). Tanpa parameter & pagination. Bukan GET → 405.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar assignee akun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string } } }

  /api/public/{apiKey}/batch:
    get:
      operationId: getBatches
      summary: List batch (terbaru dulu; tanpa cursor)
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: courier, in: query, schema: { type: string }, description: 'Nilai persis; courier=Ninja membaca batch lama' }
        - { name: dateRange, in: query, schema: { type: string }, description: 'JSON; kedua batas eksklusif, dibaca UTC; bukan JSON → 400' }
        - { name: batchFilter, in: query, schema: { type: string, enum: [unpaid, error, active, delivered, undelivered, rts, reconciled] }, description: 'Hanya batch dengan counter tsb > 0' }
        - { name: keyword, in: query, schema: { type: string }, description: 'Nomor batch, teks polos (bukan regex)' }
        - { name: address_id, in: query, schema: { type: string }, description: '_id alamat pickup' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Daftar batch
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      count: { type: integer, description: 'total batch yang cocok filter' }
                      data: { type: array, items: { $ref: '#/components/schemas/Batch' } }
    delete:
      operationId: deleteBatch
      summary: Hapus batch — cek deletedCount/unDeletedCount, bukan success
      description: >-
        Menghapus batch dan semua order di dalamnya yang masih bisa dihapus (aturan status sama dengan DELETE /order).
        Hapus dua kali → 200 deletedCount 0. Draft batch → isBatchDraft:true. courier wajib selain JNE.
      parameters: [{ $ref: '#/components/parameters/ApiKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: '_id batch ATAU nomor batch (nilai tunggal, bukan array)' }
                courier: { type: string, enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx], default: JNE }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/Envelope' }

  /api/public/{apiKey}/getReceiverScoreByNumberUser:
    get:
      operationId: getReceiverScore
      summary: Skor penerima per kurir + summary (by no. HP)
      description: >-
        Key aktif + IP saja. Produksi: whitelist (403) dan batas harian (429 sampai tengah malam WIB); sandbox: terbuka,
        data contoh deterministik (nomor berakhiran 0 → bentuk tanpa kurir). Nomor tanpa transaksi tetap 200 (bukan 404).
      parameters:
        - $ref: '#/components/parameters/ApiKey'
        - { name: search, in: query, required: true, schema: { type: string }, description: 'Satu no. HP; 08…/8…/62…/+62… menemukan record yang sama. Hilang/kosong/daftar → 422' }
      responses:
        '4XX': { $ref: '#/components/responses/Error' }
        '200':
          description: Skor penerima per kurir
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        description: >-
                          phone (tanpa 0/62/+62) + objek per kurir { total, value, inProgress, delivered, rts, undelivered, rate (0–10) }
                          ({} = tanpa data) + summary { average_number (0–10 | null), average_score (A … E-, prefix ≈ bila < 4 transaksi) }.
                        additionalProperties: true

webhooks:
  orderStatusUpdate:
    post:
      operationId: orderStatusUpdate
      summary: Order Status Update Webhook (Mengantar → Integrator URL)
      description: >-
        Event perubahan status pesanan yang dikirim Mengantar ke Webhook URL Anda.
        Tervalidasi dengan HMAC-SHA256 hex dari `{x-timestamp}.{raw body}` menggunakan Webhook Secret.
      parameters:
        - name: x-timestamp
          in: header
          required: true
          schema: { type: string, example: '1787548800000' }
          description: Timestamp waktu pengiriman dalam milidetik
        - name: x-signature
          in: header
          required: true
          schema: { type: string }
          description: HMAC-SHA256 signature dalam heksadesimal
        - name: x-environment
          in: header
          required: false
          schema: { type: string, enum: [sandbox] }
          description: Hanya ada pada kiriman sandbox; tidak ikut ditandatangani. Tolak di receiver produksi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '200':
          description: Event diterima dan diakui integrator (harus respons dalam < 5 detik)

components:
  parameters:
    ApiKey:
      name: apiKey
      in: path
      required: true
      schema: { type: string }
      description: API key Mengantar (RAHASIA — server-only)

  responses:
    Envelope:
      description: Amplop standar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

    Error:
      description: Request ditolak (autentikasi, validasi, atau aturan bisnis)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    PosCodIneligible:
      type: object
      description: Body 403 saat COD pos diblokir (docs resmi). Ketiga status memakai message yang sama.
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string, example: Pos Indonesia COD is not available for this account }
        status: { type: string, enum: [new_seller, insufficient, blocked] }
        deliveredRate: { type: number, example: 70 }
        minimumDeliveredRate: { type: number, example: 82 }
      required: [success, message, status]
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        errors: {}
        errorsFront: {}
        code: { type: string, description: 'kode error mesin, mis. COURIER_DISABLED (docs resmi)' }
        courier: { type: string }
      required: [success]

    AddressSearchItem:
      type: object
      properties:
        _id: { type: string }
        COUNTRY_NAME: { type: string }
        PROVINCE_NAME: { type: string }
        CITY_NAME: { type: string }
        DISTRICT_NAME: { type: string }
        SUBDISTRICT_NAME: { type: string }
        ZIP_CODE: { type: string }
        fullAddress: { type: string }
        fullAddressWithoutDistrict: { type: string }
      additionalProperties: true
      description: 'Field lain (kode kurir, flag cakupan) data internal — rujuk alamat dengan _id saja.'

    PickupAddress:
      type: object
      properties:
        _id: { type: string }
        PICKUP_NAME: { type: string }
        PICKUP_PIC: { type: string }
        PICKUP_PIC_PHONE: { type: string }
        PICKUP_AUTOFILL: { type: string }
        PICKUP_FULL_AUTOFILL: { type: string }
        PICKUP_ADDRESS: { type: string }
        PICKUP_CITY: { type: string }
        PICKUP_REGION: { type: string }
        PICKUP_DISTRICT: { type: string }
        PICKUP_SUBDISTRICT: { type: string }
        PICKUP_ZIP: { type: string }
        user_id: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        pinpointData:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }

    PickupAddressInput:
      type: object
      required: [PICKUP_AUTOFILL, PICKUP_ADDRESS, PICKUP_PIC_PHONE, PICKUP_PIC, PICKUP_NAME]
      properties:
        PICKUP_AUTOFILL: { type: string, description: _id data wilayah dari /address/search }
        PICKUP_ADDRESS: { type: string }
        PICKUP_PIC_PHONE: { type: string }
        PICKUP_PIC: { type: string }
        PICKUP_NAME: { type: string }
        pinpointData:
          type: object
          description: 'Wajib bila alamat dipakai untuk scheduled pickup Pos Indonesia (pos). lat -90..90, lng -180..180; null/omit bila tidak ada'
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        SHIPPER_ADDR1: { type: string, description: (opsional) alamat retur berbeda }
        SHIPPER_AUTOFILL: { type: string }
        SHIPPER_CONTACT: { type: string }
        SHIPPER_PHONE: { type: string }

    PickupAddressUpdateInput:
      type: object
      properties:
        PICKUP_NAME: { type: string }
        PICKUP_PIC: { type: string }
        PICKUP_PIC_PHONE: { type: string }
        PICKUP_ADDRESS: { type: string }
        PICKUP_AUTOFILL: { type: string, minLength: 1, description: 'mengganti seluruh wilayah; tidak boleh kosong' }
        pinpointData:
          type: [object, 'null']
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        SHIPPER_ADDR1: { type: string }
        SHIPPER_AUTOFILL: { type: string }
        SHIPPER_CONTACT: { type: string }
        SHIPPER_PHONE: { type: string }
      description: 'Field wilayah (PICKUP_CITY/REGION/DISTRICT/SUBDISTRICT) bukan parameter: berasal dari PICKUP_AUTOFILL.'

    PickupTime:
      type: object
      required: [_id, date, time]
      properties:
        _id: { type: string }
        date:
          type: [string, integer]
          description: 'POST /time → ISO 8601 (tengah malam UTC); GET /time → Unix ms dengan jam Jakarta ditulis seolah UTC (baca dalam UTC)'
        time: { type: string, example: '13:00' }
        status: { type: string }
        isSunday: { type: boolean }
        address: { type: object, additionalProperties: true }

    CourierRate:
      type: object
      properties:
        price: { type: number }
        estimatedPrice: { type: number }
        estimatedSpecialPrice: { type: number, description: harga setelah diskon }
        currency: { type: string, example: IDR }
        discountPercent: { type: number }
        discount: { type: number }
        codFee: { type: number }
        estimate_delivery: { type: string, example: '1 - 2 Days' }
        estimatedDate: { type: string, example: '2-4 hari' }
        unsupported: { type: [boolean, 'null'] }
        unsupported_cod: { type: [boolean, 'null'] }
        isDangerousGoodsSupported: { type: boolean, description: 'kapabilitas DG kurir; hanya bila isDangerousGoods dikirim' }
        discountExtraPercent: { type: number }
        discountExtra: { type: number }
        unsupportedOriginSpx:
          type: boolean
          description: 'Tidak ada di docs resmi; teramati live pada entri spx (2026-09-25). true → perlakukan seperti unsupported=true.'
        unsupportedPickup:
          type: boolean
          description: 'Tidak ada di docs resmi; teramati live pada entri spx (2026-09-25). Arti belum dipastikan.'
        pickupSchedule:
          type: object
          description: 'Hanya entri spx (docs resmi): slot pickup SPX hari ini s.d. lusa per tanggal YYYY-MM-DD; timeEpoch dalam detik.'
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                timeRangeId: { type: integer }
                start: { type: string, example: '14:00' }
                end: { type: string, example: '22:00' }
                timeEpoch: { type: integer, description: 'Unix detik (docs resmi)' }
        cargoPrice: { type: number }
        cargoEstimatedPrice: { type: number }
        cargoDiscountPercent: { type: number }
        minimumWeightCargo: { type: number, description: 'hanya entri cargo (3PL)' }
        isFlat: { type: boolean, description: '3PL: hanya anteraja' }

    DropshipperInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, description: Nama toko / pengirim dropshipper }
        phone: { type: string, minLength: 9, description: No. telepon dropshipper }

    Dropshipper:
      type: object
      required: [id, name, phone]
      properties:
        id: { type: string, description: ObjectId dropshipper }
        name: { type: string }
        phone: { type: string }

    DropshipperListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/Dropshipper' }
        pagination:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }

    LabelGenerationRequest:
      type: object
      required: [orderId, courier, format]
      properties:
        orderId: { type: string, description: Satu ID order yang valid dan telah terbayar }
        courier: { type: string, example: JNE, description: 'Case-insensitive di endpoint ini' }
        format:
          type: string
          enum:
            - normal-1
            - normal-2
            - normal-4
            - normal-6
            - thermal-10x10
            - thermal-10x15
            - thermal-8x6
            - thermal-new-10x10
            - thermal-new-10x15

    LabelGenerationPendingResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [labelGenerationId, status]
          properties:
            labelGenerationId: { type: string }
            status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED], description: 'Request bisa memakai ulang job aktif; tetap tanpa downloadUrl' }

    LabelGenerationStatusResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [labelGenerationId, status]
          properties:
            labelGenerationId: { type: string }
            status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
            format: { type: string }
            downloadUrl: { type: string, description: GCS signed URL (aktif 15 menit) }
            errorMessage: { type: string }

    Batch:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string, description: 'batch_id untuk pay-unpaid; id untuk DELETE /batch' }
        id: { type: string, description: 'nomor batch (bisa bersufiks, mis. -1); dipakai sebagai batch di GET /order' }
        courier: { type: string }
        orders: { type: integer }
        error: { type: integer }
        unpaid: { type: integer }
        delivered: { type: integer }
        active: { type: integer }
        undelivered: { type: integer }
        rts: { type: integer }
        reconciled: { type: integer }
        totalToPay: { type: number }
        totalToPaySpecial: { type: number, description: 'yang ditagih pay-unpaid' }
        address_id: { type: string }
        isDraft: { type: boolean }
        isArchived: { type: boolean }
        createdAt: { type: string }
        orderData:
          type: array
          items:
            type: object
            properties: { orderId: { type: string }, cnote_no: { type: [string, 'null'] }, status: { type: string }, SPECIAL_INS: { type: [string, 'null'] } }

    CreateOrderRequest:
      type: object
      required: [courier, pickup, orders]
      properties:
        courier:
          type: string
          enum: [JNE, SiCepat, Sap, iDexpress, JT, lion, anteraja, pos, spx]
          description: >-
            Kurir untuk shipment, case-sensitive (9 nilai docs resmi v2). `spx` = SPX Express (sandbox: hanya area Jakarta).
            Ninja discontinued per 1 September 2026 → 400.
        pickup: { $ref: '#/components/schemas/Pickup' }
        orders:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }

    Pickup:
      type: object
      required: [type, address_id]
      properties:
        type: { type: string, enum: [scheduledPickup, dropOff], description: 'dropOff untuk JNE/spx hanya bila Drop Off aktif di akun; anteraja tidak mendukung dropOff' }
        address_id: { type: string, description: '_id alamat pickup dari GET /address; bukan _id wilayah' }
        time_id: { type: string, description: 'wajib bila scheduledPickup; ≥ 90 menit dari sekarang; spx: harus di dalam slot SPX hari itu' }
        volume: { type: string, enum: [volumeMotor, volumeMobil, volumeTruck], description: wajib bila scheduledPickup }
      allOf:
        - if:
            properties: { type: { const: scheduledPickup } }
          then:
            properties:
              time_id: {}
              volume: {}
            required: [time_id, volume]

    OrderItem:
      type: object
      required: [customerAddressDataId, customerAddress, customerName, customerPhone, weight, quantity, parcelContent]
      oneOf:
        - properties:
            goodsValue: {}
            COD: {}
          required: [goodsValue]
          not:
            properties: { COD: {} }
            required: [COD]
        - properties:
            COD: {}
            goodsValue: {}
          required: [COD]
          not:
            properties: { goodsValue: {} }
            required: [goodsValue]
      properties:
        customerAddressDataId: { type: string, description: 'destination_id (_id dari /address/search)' }
        customerAddress: { type: string, minLength: 1 }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, description: '10–15 digit (62/+62 dihitung); spasi & tanda hubung diterima; ekstensi x12 diterima tapi tidak dihitung' }
        parcelContent: { type: string, minLength: 1 }
        weight: { type: number, exclusiveMinimum: 0, description: 'kg, positif (negatif → 400). JT ≤ 50; anteraja/pos/spx 1–50. Bila customProducts: = Σ(qty×weight)' }
        quantity: { type: integer, minimum: 1, description: 'bila customProducts diisi harus = Σ(qty)' }
        goodsValue: { type: number, minimum: 0, description: 'Non-COD; wajib bila COD kosong' }
        COD: { type: number, minimum: 1000, description: 'Nilai barang + ongkir + biaya COD; ≥ Rp1.000 (lion ≥ Rp10.000), ≤ batas COD kurir. Bila COD & goodsValue dikirim, COD dipakai' }
        eco: { type: [boolean, 'null'], description: 'Hanya courier JT: true → J&T ECO (SERVICE_CODE ECO). Tidak bisa dengan cargo/isDangerousGoods. Rute tanpa ECO → ordersClosedDestination (tidak dialihkan ke REG)' }
        assignee: { type: string, description: _id dari /my-users }
        destinationMark: { type: string }
        deliveryInstruction: { type: string }
        dontIncludeSubdistrict: { type: boolean }
        cargo: { type: boolean, description: 'true → Cargo (JNE, SiCepat, Sap, iDexpress)' }
        isDangerousGoods: { type: boolean, default: false, description: 'JSON Boolean. Hanya SiCepat (HALU) dan iDexpress (Regular); tidak bisa dengan cargo' }
        dropShipper:
          type: object
          description: Data dropshipper tersimpan dari master dropshippers
          required: [id, name, phone]
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string }
        customProducts:
          type: array
          description: 'Produk di tabel label. Item: name & qty wajib; variant, price, weight (default 1) opsional. Alias: quantity/orderQuantity, harga/regularPrice. weight & quantity order harus = totalnya.'
          items:
            type: object
            required: [name, qty]
            properties:
              name: { type: string, minLength: 1 }
              variant: { description: string atau object }
              qty: { type: number, minimum: 1, description: 'wajib; alias: quantity, orderQuantity' }
              price: { type: number, minimum: 0, description: 'alias: harga, regularPrice' }
              weight: { type: number, exclusiveMinimum: 0, description: default 1 }

    CreateOrderResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        batch: { type: string }
        batch_id: { type: string }
        courier: { type: string }
        errors: { type: array, items: {}, description: 'kosong bila batch dibuat' }
        ordersClosedDestination: { type: array, items: {}, description: 'order yang TIDAK dibuat karena tujuan tidak dilayani (tidak ada di data)' }
        idempotentReplayed:
          type: boolean
          description: Ada (true) bila respons adalah replay idempotency — salinan, bukan status terkini
        data:
          type: array
          items:
            type: object
            properties:
              ORDER_ID: { type: string }
              cnote_no: { type: [string, 'null'], description: nomor resi; null bila unpaid/belum tersedia }
              status: { type: string }
              statusCategory: { type: string }
              isPaid: { type: boolean }
              batch_id: { type: string }
              batch: { type: string }
              dropShipperId: { type: string }
              SERVICE_CODE: { type: string, description: 'REG, atau ECO untuk J&T ECO' }
              _id: { type: string }
              price: { type: number }
              estimatedSpecialPrice: { type: number }
              error: { description: 'Hanya bila status error: pesan kurir' }

    TrackingInfo:
      type: object
      properties:
        cnote_no: { type: [string, 'null'] }
        ORDER_ID: { type: string }
        courier: { type: string }
        status: { type: string }
        statusCategory: { type: string }
        RECEIVER_NAME: { type: string }
        RECEIVER_PHONE: { type: string }
        RECEIVER_CITY: { type: string }
        RECEIVER_REGION: { type: string }
        GOODS_DESC: { type: string }
        WEIGHT: { type: number }
        batch: { type: string }
        createdAt: { type: string }
        SERVICE_CODE: { type: string }
        isPaid: { type: boolean }
        lastStatusChange: { type: string }
        history:
          type: array
          description: 'Hanya pada lookup tracking_id/order_id (juga mencari arsip)'
          items:
            type: object
            properties:
              date: { type: string, description: 'Format DD-MM-YYYY HH:mm (Asia/Jakarta)' }
              desc: { type: string, description: Keterangan progres status (teks kurir) }
              code: { type: string, description: 'kode status kurir (JNE)' }
              location: { type: string }
              proofUrl: { type: string, description: 'JNE: foto bukti pada entri delivered' }
        proofHistory:
          type: array
          description: 'Hanya terisi pada lookup order_id; kosong pada list & tracking_id'
          items:
            type: object
            properties: { status: { type: string }, date: { type: string }, photo: { type: string }, video: { type: string } }

    WebhookPayload:
      type: object
      required: [cnote_no, order_id, courier, service_code, status_category]
      properties:
        service_code: { type: [string, 'null'], description: 'REG / ECO dst.; selalu ada di body nyata, null bila order tanpa service code' }
        cnote_no: { type: string, description: Nomor resi / AWB pengiriman }
        order_id: { type: string, description: ID unik pesanan Mengantar }
        courier: { type: string, description: Kurir penangan pesanan }
        status_category:
          type: string
          description: >-
            Kategori status (open-ended, beda per kurir — selalu sediakan default branch): PENDING PICKUP, PICKED UP, ON DELIVERY,
            DELIVERED, UNDELIVERED, PICKUP FAILED, RTS, ACTIVE/WAITING NEXT PROCESS, ERROR, CANCELED/CANCELLED.
